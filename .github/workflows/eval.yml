name: Eval

# Scores a classifier model and the current prompt against the hand-labeled set in
# evals/classifier. Calls go through the "radar" AI Gateway, so the daily spend cap
# applies. A full run of 150 posts costs a few cents to about $0.30 depending on the
# model, and takes ~10 minutes at 18 requests/minute.

on:
  workflow_dispatch:
    inputs:
      model:
        description: Workers AI model ID
        type: string
        default: "@cf/zai-org/glm-5.3-flash"
      reasoning:
        description: "reasoning_effort for reasoning models (low / medium / high / none); empty to omit"
        type: string
        default: low
      rpm:
        description: "Requests per minute (Workers Paid models allow 20, others 300)"
        type: string
        default: "18"
      limit:
        description: Only the first N posts (empty for all 150)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Run classifier eval
        working-directory: apps/ingest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }} # README fetches for GitHub posts
          MODEL: ${{ inputs.model }}
          REASONING: ${{ inputs.reasoning }}
          RPM: ${{ inputs.rpm }}
          LIMIT: ${{ inputs.limit }}
        run: |
          args=(--model="$MODEL" --rpm="$RPM" --out=results.json)
          if [ -n "$REASONING" ]; then args+=(--reasoning="$REASONING"); fi
          if [ -n "$LIMIT" ]; then args+=(--limit="$LIMIT"); fi
          node scripts/eval-classifier.ts "${args[@]}" | tee report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eval-results
          path: |
            apps/ingest/results.json
            apps/ingest/report.txt
          if-no-files-found: ignore
